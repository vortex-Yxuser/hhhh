plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vortex.hhhhvpn'
    compileSdk 34
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.vortex.hhhhvpn"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0-pro"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// Auto fetch & build hev-socks5-tunnel (tun2socks) for maximum performance
tasks.register('fetchTun2socks', Exec) {
    onlyIf { !file("${projectDir}/jni/hev-socks5-tunnel/Android.mk").exists() }
    commandLine 'git', 'clone', '--recursive', '--depth', '1',
            'https://github.com/heiher/hev-socks5-tunnel',
            "${projectDir}/jni/hev-socks5-tunnel"
}

tasks.register('buildTun2socks', Exec) {
    dependsOn 'fetchTun2socks'
    doFirst {
        def ndkDir = android.ndkDirectory
        def ndkBuildExe = new File(ndkDir, System.getenv('OS')?.contains('Windows') ? 'ndk-build.cmd' : 'ndk-build')
        commandLine "${ndkBuildExe}", '-C', projectDir, "-j${Runtime.runtime.availableProcessors()}"
    }
}

preBuild.dependsOn buildTun2socks

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Modern maintained JSch fork - better algorithms, speed & stability
    implementation 'com.github.mwiede:jsch:0.2.20'
}
